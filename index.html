<style>

<script>
  /* ============================================================
     СПИСОК РОЛИКОВ. Добавляй ссылки в массив через запятую.
     Поддерживается: YouTube, VK Видео, а также прямые файлы .mp4
     (например "videos/demo1.mp4", если положишь их в репозиторий).
     Проверка: открой страницу с ?debug в конце адреса — на роликах
     появятся номера, по ним удобно найти и удалить нерабочие.
     ============================================================ */
  const VIDEOS = [
    "https://vkvideo.ru/video-243094477_456239033",
    "https://vkvideo.ru/video-243094477_456239017",
    "https://vkvideo.ru/video-243094477_456239018",
    "https://vkvideo.ru/video-243094477_456239019",
    "https://vkvideo.ru/video-243094477_456239020",
    "https://vkvideo.ru/video-243094477_456239021",
    "https://vkvideo.ru/video-243094477_456239022",
    "https://vkvideo.ru/video-243094477_456239023",
    "https://vkvideo.ru/video-243094477_456239024",
    "https://vkvideo.ru/video-243094477_456239025",
    "https://vkvideo.ru/video-243094477_456239026",
    "https://vkvideo.ru/video-243094477_456239027",
    "https://vkvideo.ru/video-243094477_456239028",
    "https://vkvideo.ru/video-243094477_456239029",
    "https://vkvideo.ru/video-243094477_456239030",
    "https://vkvideo.ru/video-243094477_456239031",
    "https://vkvideo.ru/video-243094477_456239032"
    // добавляй сюда остальные ролики через запятую
  ];

  function toEmbed(rawUrl) {
    let u;
    try { u = new URL(rawUrl.trim(), location.href); } catch (e) { return null; }
    const host = u.hostname.replace(/^www\./, "").replace(/^m\./, "");
    const yt = function (id) { return { type: "iframe", src: "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1" }; };

    if (host === "youtu.be") { const id = u.pathname.slice(1); return id ? yt(id) : null; }
    if (host === "youtube.com" || host === "youtube-nocookie.com") {
      let id = u.searchParams.get("v");
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]{6,})/);
      if (!id && m) id = m[2];
      return id ? yt(id) : null;
    }
    if (["vk.com", "vk.ru", "vkvideo.ru"].includes(host)) {
      if (u.pathname.includes("video_ext.php")) return { type: "iframe", src: u.href };
      const src = u.pathname + " " + (u.searchParams.get("z") || "");
      const m = src.match(/video(-?\d+)_(\d+)/);
      if (m) {
        const hashQ = u.searchParams.get("hash") ? "&hash=" + u.searchParams.get("hash") : "";
        return { type: "iframe", src: "https://vk.com/video_ext.php?oid=" + m[1] + "&id=" + m[2] + "&hd=2" + hashQ };
      }
    }
    if (/\.(mp4|webm)$/i.test(u.pathname)) return { type: "video", src: u.href };
    return null;
  }

  const debug = /[?&]debug\b/.test(location.search);
  const grid = document.getElementById("grid");

  VIDEOS.forEach(function (url, i) {
    const e = toEmbed(url);
    if (!e) return;
    const box = document.createElement("div");
    box.className = "player";
    let el;
    if (e.type === "video") {
      el = document.createElement("video");
      el.src = e.src; el.controls = true; el.preload = "metadata"; el.playsInline = true;
      el.addEventListener("error", function () { box.remove(); });
    } else {
      el = document.createElement("iframe");
      el.src = e.src; el.loading = "lazy"; el.title = "Видео " + (i + 1);
      el.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
      el.allowFullscreen = true;
    }
    box.appendChild(el);
    if (debug) {
      const b = document.createElement("div");
      b.className = "badge"; b.textContent = "№ " + (i + 1);
      box.appendChild(b);
    }
    grid.appendChild(box);
  });
</script>
