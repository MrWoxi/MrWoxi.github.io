<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио — Unity-разработчик</title>
<style>
  :root { --bg: #f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101216; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

  /* Телефон — 1 ролик в ряд, планшет/ноутбук — 2 ролика в ряд */
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .player { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div class="wrap"><main class="grid" id="grid"></main></div>

<script>
  /* ============================================================
     СПИСОК РОЛИКОВ. Просто добавляй ссылки в массив (YouTube или VK Видео).
     ============================================================ */
  const VIDEOS = [
    "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
    "https://vk.com/video-22822305_456239018"
    // добавляй сюда остальные ролики через запятую
  ];

  function toEmbed(rawUrl) {
    let u;
    try { u = new URL(rawUrl.trim()); } catch (e) { return null; }
    const host = u.hostname.replace(/^www\./, "").replace(/^m\./, "");

    if (host === "youtu.be") {
      const id = u.pathname.slice(1);
      return id ? "https://www.youtube-nocookie.com/embed/" + id : null;
    }
    if (host === "youtube.com" || host === "youtube-nocookie.com") {
      let id = u.searchParams.get("v");
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]{6,})/);
      if (!id && m) id = m[2];
      return id ? "https://www.youtube-nocookie.com/embed/" + id : null;
    }
    if (["vk.com", "vk.ru", "vkvideo.ru"].includes(host)) {
      if (u.pathname.includes("video_ext.php")) return u.href;
      const src = u.pathname + " " + (u.searchParams.get("z") || "");
      const m = src.match(/video(-?\d+)_(\d+)/);
      if (m) {
        const hashQ = u.searchParams.get("hash") ? "&hash=" + u.searchParams.get("hash") : "";
        return "https://vk.com/video_ext.php?oid=" + m[1] + "&id=" + m[2] + "&hd=2" + hashQ;
      }
    }
    return null;
  }

  const grid = document.getElementById("grid");
  VIDEOS.forEach(function (url) {
    const embed = toEmbed(url);
    if (!embed) { console.warn("Не удалось разобрать ссылку:", url); return; }
    const box = document.createElement("div");
    box.className = "player";
    const frame = document.createElement("iframe");
    frame.src = embed;
    frame.loading = "lazy";
    frame.title = "Видео";
    frame.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
    frame.allowFullscreen = true;
    box.appendChild(frame);
    grid.appendChild(box);
  });
</script>
</body>
</html>
